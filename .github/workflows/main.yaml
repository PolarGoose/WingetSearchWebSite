on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-node@main
        with:
          node-version: latest
      - shell: pwsh
        run: ./build.ps1
      - uses: actions/configure-pages@main
      - uses: actions/upload-pages-artifact@main
        with:
          path: build/dist

      # workaround for https://github.com/actions/deploy-pages/issues/451
      - run: sleep 10

      - uses: actions/deploy-pages@main
